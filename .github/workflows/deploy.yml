name: Deploy

# Despliegue a Easypanel (PaaS self-host sobre VPS). Easypanel construye la
# imagen desde el Dockerfile del repo; este workflow solo DISPARA el redeploy
# vía el webhook de despliegue del servicio y luego comprueba el healthcheck.
#
# - push a `develop`  → entorno STAGING
# - release publicada → entorno PRODUCTION
#
# Requisitos previos (configurados por OPS en GitHub Environments, ver
# infra/env.reference.md): los webhooks de deploy y las URLs base por entorno.
on:
  push:
    branches: [develop]
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Easypanel redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # El entorno selecciona el conjunto de secrets correcto y permite la
    # aprobación manual previa al deploy de producción (protected environment).
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}

    steps:
      - name: Trigger redeploy webhook
        # Easypanel reconstruye y aplica las migraciones según la config del
        # servicio (deploy command: `prisma migrate deploy && node server.js`).
        run: |
          if [ -z "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::EASYPANEL_DEPLOY_WEBHOOK no configurado en el environment"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}"

      - name: Wait for rollout
        run: sleep 30

      - name: Smoke test /api/health
        # El endpoint lo implementa BE; hasta entonces este paso es informativo.
        run: |
          BASE_URL="${{ vars.APP_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            echo "::warning::APP_BASE_URL no configurado; se omite el smoke test"
            exit 0
          fi
          for i in $(seq 1 5); do
            CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE_URL/api/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthcheck OK ($CODE)"
              exit 0
            fi
            echo "Intento $i: healthcheck devolvió $CODE; reintentando..."
            sleep 10
          done
          echo "::error::Healthcheck no respondió 200 tras el deploy"
          exit 1
